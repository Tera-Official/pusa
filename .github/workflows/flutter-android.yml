name: Flutter Android

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.pusa.smart_saving --project-name pusa_mobile .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pusa-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
